[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "crisvis"
version = "0.1.0"
description = "Asistente personal local: interfaz holográfica de JARVIS con el cerebro de OpenJarvis."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "MIT" }
dependencies = [
    # El cerebro. Fijado a la serie 1.0.x: crisvis.brain programa contra su SDK,
    # sus registros (agentes/herramientas/motores), su ToolExecutor y su EventBus.
    "openjarvis[server]>=1.0.4,<1.1",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.0",
    "tomli>=2.0; python_version < '3.11'",
    # Control del equipo (crisvis.body.pc): ratón, teclado, capturas, procesos,
    # papelera; en Windows además UI Automation y el volumen del sistema.
    "pyautogui>=0.9.54",
    "mss>=9.0",
    "pillow>=10.0",
    "psutil>=5.9",
    "send2trash>=1.8",
    "pyperclip>=1.8",
    "uiautomation>=2.0.20; sys_platform == 'win32'",
    "pycaw>=20240210; sys_platform == 'win32'",
]

[project.optional-dependencies]
# Transcripción local (faster-whisper) a través de openjarvis.speech.
voz-local = ["openjarvis[speech]>=1.0.4,<1.1"]
# Memoria vectorial y lectura de PDF para la base de conocimiento.
memoria = ["openjarvis[memory-bm25,pdf]>=1.0.4,<1.1"]
# Proveedores en la nube opcionales (solo si el usuario los configura).
nube = ["openjarvis[inference-cloud]>=1.0.4,<1.1"]

[project.scripts]
crisvis = "crisvis.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/crisvis"]
# La interfaz compilada (apps/face -> src/crisvis/static) viaja dentro del paquete.
artifacts = ["src/crisvis/static/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B"]

[tool.ruff.lint.per-file-ignores]
# Marcado HTML/CSS y textos para el modelo: partirlos empeora su lectura.
"src/crisvis/media/page.py" = ["E501"]
"src/crisvis/body/display.py" = ["E501"]
